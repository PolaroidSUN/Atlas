[package]
name = "atlas"
version = "1.7.4-alpha.1"
description = "Atlas workspace desktop app"
authors = ["Atlas Team"]
edition = "2021"

[lib]
name = "atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
